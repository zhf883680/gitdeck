<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>gitdeck</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230d1219'/%3E%3Cg stroke='%238ab0ff' stroke-width='2' fill='none' stroke-linecap='round'%3E%3Ccircle cx='7' cy='6' r='2'/%3E%3Ccircle cx='7' cy='18' r='2'/%3E%3Ccircle cx='17' cy='12' r='2'/%3E%3Cpath d='M7 8v8M9 6h2a6 6 0 0 1 6 6'/%3E%3C/g%3E%3C/svg%3E" />

</head>
<body>
<div id="app" class="app">
  <aside class="rail">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="6" cy="5" r="2.4"/><circle cx="6" cy="19" r="2.4"/><circle cx="18" cy="12" r="2.4"/>
        <path d="M6 7.4v9.2M8.4 5h4.2a5.4 5.4 0 0 1 5.4 5.4"/>
      </svg>
      <span>gitdeck</span>
    </div>
    <div class="rail-search">
      <input id="repo-filter" type="text" placeholder="过滤仓库…" autocomplete="off" spellcheck="false" />
    </div>
    <div id="repo-list" class="repo-list"></div>
    <div class="rail-foot">
      <button id="add-root" class="btn-mini">+ 添加目录</button>
      <div id="roots" class="roots"></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="repo-head">
        <div class="repo-title">
          <span id="repo-name">未选择仓库</span>
          <span id="repo-dirty" class="dirty-badge hidden"></span>
        </div>
        <div id="repo-path" class="repo-path">从左侧选择一个 Git 仓库</div>
      </div>
      <div class="topbar-right">
        <div id="head-chip" class="chip-branch hidden"></div>
        <button id="sync-btn" class="btn-icon" title="同步远端：fetch --prune 后快进拉取 (s)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>
        </button>
        <button id="refresh" class="btn-icon" title="重新读取本地分支状态，不访问远端 (r)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="branches">分支</button>
      <button class="tab" data-tab="compare">对比</button>
      <button class="tab" data-tab="history">历史与搜索</button>
      <div class="tabs-spacer"></div>
      <label class="base-pick">
        <span>基准</span>
        <select id="base-select"></select>
      </label>
    </nav>

    <section class="view">
      <div id="view-branches" class="pane active"></div>
      <div id="view-compare" class="pane"></div>
      <div id="view-history" class="pane"></div>
    </section>
  </main>

  <aside id="drawer" class="drawer">
    <div class="drawer-head">
      <div class="drawer-title">
        <span class="dot-live"></span>
        <span id="drawer-title">Codex 解读</span>
      </div>
      <div class="drawer-actions">
        <button id="drawer-stop" class="btn-ghost sm hidden">停止</button>
        <span id="drawer-model" class="drawer-model">codex</span>
        <button id="drawer-close" class="btn-icon" title="关闭 (Esc)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <div id="drawer-status" class="drawer-status"></div>
    <div id="drawer-body" class="drawer-body">
      <div class="drawer-empty">
        <p>选择一个分支或提交的差异，点「Codex 解读」。</p>
        <p class="dim">会在你本地的仓库目录里以只读沙箱运行 <code>codex exec</code>。</p>
      </div>
    </div>
    <div class="drawer-foot">
      <input id="drawer-input" type="text" placeholder="追问一句，例如：这个改动会影响哪些调用方？" />
      <button id="drawer-send" class="btn-primary sm">追问</button>
    </div>
  </aside>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
